<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="robots" content="noindex,nofollow">
<title id="pageTitle">پنل مدیریت</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/vazirmatn-font-face.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<!--STYLESHEET-->
</head>
<body>
<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark"><i class="fa-solid fa-bolt"></i></span>
      <div class="brand-txt"><b id="brandName">پنل</b><span class="mono" id="brandVer">v—</span></div>
      <button class="icon-btn sb-close" id="sbClose" title="بستن"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="sf-row"><span><i class="fa-solid fa-database"></i> ذخیره‌سازی</span><b id="sfStore">—</b></div>
      <div class="sf-row"><span><i class="fa-solid fa-users"></i> کاربران</span><b id="sfUsers">—</b></div>
      <div class="sf-row"><span><i class="fa-solid fa-code-branch"></i> نسخه</span><b class="mono" id="sfVer">—</b></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" title="منو"><i class="fa-solid fa-bars"></i></button>
      <div class="tb-live"><span class="dot on" id="tbDot"></span><span id="tbState">در حال بارگذاری…</span></div>
      <span class="badge" id="tbReq"></span>
      <div class="spacer"></div>

      <div class="search" id="searchBox">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="tbSearch" placeholder="جستجو در کاربران، لاگ‌ها و تنظیمات…" autocomplete="off">
        <div class="search-drop" id="searchDrop"></div>
      </div>

      <button class="icon-btn" id="themeBtn" title="تغییر تم"><i class="fa-solid fa-moon"></i></button>
      <button class="btn danger sm" id="panicBtn" title="توقف فوری سرویس"><i class="fa-solid fa-triangle-exclamation"></i> Panic</button>
      <button class="btn sm" id="logoutBtn" title="خروج از پنل"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
    </header>

    <main class="content" id="view"></main>
    <footer class="foot" id="foot"></footer>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
<!--APPJS-->
</body>
</html>
