<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="robots" content="noindex,nofollow">
<title id="pageTitle">پنل مدیریت</title>
<!-- فونت فارسی: دو منبع پشتیبان — اگر یکی لود نشود، دیگری کار می‌کند -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/vazirmatn-font-face.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  /* اگر CDN کند بود، فونت سیستمی سریع‌تر نمایش داده می‌شود (FOUT جلوگیری) */
  @font-face{font-family:'Vazirmatn';src:local('Vazirmatn');font-display:swap}
</style>
<!--STYLESHEET-->
</head>
<body>
<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark"><svg class="ic" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>
      <div class="brand-txt"><b id="brandName">پنل</b><span class="mono" id="brandVer">v—</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="sf-row"><span>ذخیره‌سازی</span><b id="sfStore">—</b></div>
      <div class="sf-row"><span>کاربران</span><b id="sfUsers">—</b></div>
      <div class="sf-row"><span>نسخه</span><b class="mono" id="sfVer">—</b></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar" id="topbar">
      <button class="icon-btn" id="menuBtn" title="منو">
        <svg class="ic" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="tb-live"><span class="dot on" id="tbDot"></span><span id="tbState">در حال بارگذاری…</span></div>
      <span class="badge" id="tbReq"></span>
      <div class="spacer"></div>

      <div class="search" id="searchBox">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="tbSearch" placeholder="جستجو…" autocomplete="off">
        <div class="search-drop" id="searchDrop"></div>
      </div>

      <button class="icon-btn" id="themeBtn" title="تم">
        <svg class="ic" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="btn danger sm" id="panicBtn" title="Panic">
        <svg class="ic" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>
        Panic
      </button>
      <button class="btn sm" id="logoutBtn" title="خروج">
        <svg class="ic" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        خروج
      </button>
    </header>

    <main class="content" id="view"></main>
    <footer class="foot" id="foot"></footer>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
<!--APPJS-->
</body>
</html>
