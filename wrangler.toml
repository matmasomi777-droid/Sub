# ─────────────────────────────────────────────────────────────
#  Wrangler config — VPN Panel Worker
#
#  ⚠️⚠️  این فایل را حذف نکنید  ⚠️⚠️
#
#  این فایل «بایندینگ»های ورکر را تعریف می‌کند و محدودیت آی‌پی
#  مستقیماً به آن‌ها وابسته است:
#
#      LIMITER → شیءِ ماندگار (Durable Object): یک نمونه‌ی جهانی
#      DB      → پایگاه‌ی D1: یک جدولِ مشترک برای همه‌ی isolateها
#
#  اگر این فایل را حذف کنید و ورکر را با «پیست در داشبورد» مستقر کنید،
#  این دو بایندینگ دیگر ساخته نمی‌شوند. آن‌وقت هر isolate حافظه‌ی خودش
#  را می‌شمارد، اتصالِ سوم به isolate تازه می‌افتد و از صفر شمرده می‌شود،
#  و محدودیت عملاً بی‌اثر می‌شود — بی‌صدا و بدون هیچ خطایی.
#
#  دقیقاً همین اتفاق در کامیتِ 360e05c («حذف wrangler») افتاد و همان
#  چیزی است که کاربر دید: «قبل از حذف wrangler محدودیت درست کار می‌کرد».
#
#  پس دو راه دارید — هر کدام را انتخاب کردید، بایندینگ‌ها را داشته باشید:
#
#    الف) استقرار با wrangler (دقیق‌ترین حالت):
#         npx wrangler login
#         npx wrangler secret put MASTER_KEY
#         npx wrangler deploy
#
#    ب) استقرار با پیست در داشبورد (روشِ فعلیِ پروژه):
#         Settings → Bindings → Add
#           • D1 database       → Variable name: DB
#           • Durable Object    → Variable name: LIMITER (class: ConnLimiter)
#           • KV Namespace      → Variable name: KV   (اختیاری، فقط برای ماندگاری)
#         بدون بایندینگِ DB یا LIMITER، سقفِ آی‌پی اعمال نمی‌شود.
#
#  برای بررسیِ وضعیت، در پنل: «سلامت ورکر → مرجعِ شمارشِ محدودیت اتصال»
#  یا مستقیم: GET /health  (فیلد limiterBackend)
# ─────────────────────────────────────────────────────────────

name = "panel"
# main = "worker.js"            # نسخهٔ خام — فقط برای دیباگ
main = "_worker.obf.js"          # نسخهٔ obfuscate شده (ضد-1101) — با `npm run build` ساخته می‌شود
compatibility_date = "2026-01-15"

# ── محدودسازِ اتصال: شیءِ ماندگار (برای محدودیتِ دقیقِ آی‌پی الزامی است) ────
# یک ورکر روی صدها isolate اجرا می‌شود و هر isolate حافظه‌ی خودش را دارد؛
# پس یک شمارنده‌ی درون‌حافظه‌ای فقط «همین isolate» را می‌شمارد. اتصالِ سوم
# به isolate تازه می‌افتد، از صفر شمرده می‌شود و اجازه می‌گیرد → محدودیت
# هرگز اعمال نمی‌شود. شیءِ ماندگار یک نمونه‌ی جهانیِ مشترک است، پس سقفِ
# «تعداد IPهای همزمانِ هر کاربر» واقعاً worker-wide اعمال می‌شود.
[[durable_objects.bindings]]
name       = "LIMITER"
class_name = "ConnLimiter"

# اولین بار که یک کلاسِ شیءِ ماندگار اضافه می‌شود لازم است.
[[migrations]]
tag      = "v1"
new_classes = ["ConnLimiter"]

# ── ذخیره‌سازی: D1 (بهترین) یا KV (قابل قبول) ────────────────
# ورکر با هر کدام از این دو کار می‌کند، ولی دقتشان فرق دارد:
#   D1  → افزایشِ اتمیک؛ مصرف و سقفِ اتصال دقیق
#   KV  → شمارنده‌ها ماندگار، ولی زیرِ بارِ سنگین تقریبی
#   هیچ → فقط حافظه؛ مصرف و محدودیت با هر cold start ریست می‌شوند
# کارتِ «سلامت ورکر» در پنل می‌گوید کدام فعال است.
#
# ⚠️ D1 مهم‌تر از فقط ماندگاری است: در روشِ «پیست در داشبورد»، اگر شیءِ
# ماندگار نباشد، همین D1 تنها مرجعِ مشترکِ بین isolateهاست — یعنی بدونِ
# DB هم سقفِ آی‌پی اعمال نمی‌شود. جدولِ conns خودکار ساخته می‌شود.
#
# ── D1 (توصیه‌شده) ───────────────────────────────────────────
# هر دو مقدار را با این ببینید:  npx wrangler d1 list
# ساخت پایگاه:                   npx wrangler d1 create panel-db
[[d1_databases]]
binding       = "DB"
database_name = "REPLACE_WITH_DB_NAME"
database_id   = "REPLACE_WITH_DB_ID"

# ── KV (جانشین اگر D1 نمی‌خواهید) ────────────────────────────
# ساخت: npx wrangler kv:namespace create PANEL_KV
# سپس بلوکِ زیر را از کامنت دربیاورید (اگر هر دو بایند باشند، D1 برنده است).
# [[kv_namespaces]]
# binding      = "KV"
# id           = "REPLACE_WITH_KV_NAMESPACE_ID"

# ── رازها (هرگز در این فایل نگذارید) ─────────────────────────
#   npx wrangler secret put MASTER_KEY
# برای رمزنگاریِ داده‌های ذخیره‌شده. اگر تنظیم نشود یک مقدارِ پیش‌فرض
# استفاده می‌شود و داده‌های رمزنگاری‌شده‌ی قبلی بعد از تغییر خوانده نمی‌شوند.
